<style>
/* Layout: barra lateral fixa + área de trabalho com fichas; no celular a barra vira menu superior */
:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#eef1f6; --line:#dde2ec;
  --ink:#13294b; --ink-2:#4a5b78; --ink-3:#6b7a93;
  --brand:#13294b; --brand-ink:#ffffff; --brand-soft:#e4ebf7; --side:#13294b; --side-ink:#ffffff; --side-2:#1e3a66; --side-mute:#c9d2e3;
  --ochre:#8a5a00; --ochre-soft:#fff4d6; --gold:#f5a800; --gold-ink:#13294b;
  --ok:#2f7d4f; --ok-soft:#dff1e5; --warn:#a6670c; --warn-soft:#fbecd2; --bad:#b23a3a; --bad-soft:#f7dede;
  --font-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body:"Public Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1626; --surface:#17233a; --surface-2:#1f2e4a; --line:#2a3a58;
  --ink:#eaf0fa; --ink-2:#a5b3cc; --ink-3:#7f8ea8;
  --brand:#f5b72e; --brand-ink:#13294b; --brand-soft:#1f2e4a; --side:#0a1220; --side-ink:#eaf0fa; --side-2:#17233a; --side-mute:#a5b3cc;
  --ochre:#f5b72e; --ochre-soft:#3a2d0b; --gold:#f5b72e; --gold-ink:#13294b;
  --ok:#6cc790; --ok-soft:#173326; --warn:#e3a54a; --warn-soft:#3a2c14; --bad:#ec7f7f; --bad-soft:#3d1c1c;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1626; --surface:#17233a; --surface-2:#1f2e4a; --line:#2a3a58;
  --ink:#eaf0fa; --ink-2:#a5b3cc; --ink-3:#7f8ea8;
  --brand:#f5b72e; --brand-ink:#13294b; --brand-soft:#1f2e4a; --side:#0a1220; --side-ink:#eaf0fa; --side-2:#17233a; --side-mute:#a5b3cc;
  --ochre:#f5b72e; --ochre-soft:#3a2d0b; --gold:#f5b72e; --gold-ink:#13294b;
  --ok:#6cc790; --ok-soft:#173326; --warn:#e3a54a; --warn-soft:#3a2c14; --bad:#ec7f7f; --bad-soft:#3d1c1c;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.6rem} h2{font-size:1.2rem} h3{font-size:1rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
.num,td.n,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono);font-size:.85em}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600}

.demo-banner{background:var(--ochre-soft);color:var(--ink);border-bottom:1px solid var(--line);font-size:.8rem;
  padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.demo-banner b{color:var(--ochre)}
.linkbtn{background:none;border:0;padding:0;color:var(--brand);text-decoration:underline;cursor:pointer;font-size:inherit}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:4px 10px;font-size:.82rem}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-weight:500;font-size:.88rem}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
.pw{position:relative} .pw input{padding-right:64px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--brand);cursor:pointer;font-size:.8rem;padding:6px}
.err{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:9px 12px;font-size:.86rem}
.info{background:var(--brand-soft);color:var(--ink);border-radius:8px;padding:9px 12px;font-size:.86rem}
.code-inputs{display:flex;gap:8px}
.code-inputs input{width:100%;text-align:center;font-family:var(--font-mono);font-size:1.3rem;letter-spacing:.3em}
.strength{height:5px;border-radius:9px;background:var(--surface-2);overflow:hidden}
.strength i{display:block;height:100%;transition:width .2s}
.check{display:flex;gap:8px;align-items:flex-start;font-size:.88rem}
.check input{margin-top:3px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head p{margin:4px 0 0}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:2fr 1fr}
.kpi{display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left}
.kpi .v{font-family:var(--font-display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .s{font-size:.8rem;color:var(--ink-2)}
.kpi:hover{border-color:var(--brand)}

.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:1px 9px;font-size:.76rem;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-neutral{background:var(--surface-2);color:var(--ink-2)}
.cat{display:inline-block;font-size:.74rem;font-weight:600;border-radius:4px;padding:1px 7px;border:1px solid var(--line);white-space:nowrap}
.cat.Diamante{border-color:#6b8fb3;color:#4f7aa3} .cat.Ouro{border-color:var(--ochre);color:var(--ochre)}
.cat.Prata{border-color:#8a959b;color:#6e7a80} .cat.Bronze{border-color:#a8693d;color:#a8693d}

.bar{height:8px;border-radius:9px;background:var(--surface-2);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:9px}
.bar.low i{background:var(--warn)} .bar.zero i{background:var(--bad)}

/* linha de raciocínio do parceiro */
.flow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.flow div{padding:14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.flow div:last-child{border-right:0}
.flow .v{font-family:var(--font-display);font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.flow .s{font-size:.78rem;color:var(--ink-2)}
.flow .step{font-size:.7rem;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em;font-weight:600}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;cursor:pointer;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--brand);font-weight:600}

.timeline{display:flex;flex-direction:column;gap:0;list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.timeline li:last-child{border-bottom:0}

.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters input,.filters select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px}
.filters input{min-width:0;flex:1 1 200px}

.overlay{position:fixed;inset:0;background:rgba(10,20,18,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:12px;border:1px solid var(--line);width:100%;max-width:460px;padding:22px;display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;font-size:.88rem;max-width:calc(100% - 32px)}

.empty{padding:20px;text-align:center;color:var(--ink-3)}
.lock{font-size:.8rem;color:var(--ink-3);display:flex;gap:6px;align-items:center}
.permtbl td{text-align:center} .permtbl td:first-child{text-align:left}
.yes{color:var(--ok);font-weight:700} .no{color:var(--ink-3)} .ro{color:var(--warn);font-weight:600}

[hidden]{display:none!important}
.wm{display:flex;flex-direction:column;gap:5px}
.wm b{font-family:var(--font-display);font-size:1.3rem;line-height:1.05;color:var(--gold);letter-spacing:-.01em}
.wm small{font-size:.6rem;letter-spacing:.2em;color:var(--side-mute);font-weight:500}
.ptop{background:var(--side);color:var(--side-ink)}
.ptop .in,.pnav .in,.pmain{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ptop .in{padding-block:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.pnav{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.pnav .in{display:flex;gap:4px;overflow-x:auto}
.pnav button{border:0;background:none;padding:14px 12px;cursor:pointer;color:var(--ink-2);border-bottom:3px solid transparent;font-weight:500;white-space:nowrap}
.pnav button.on{color:var(--ink);border-bottom-color:var(--gold);font-weight:600}
.pmain{padding-block:28px 56px;display:flex;flex-direction:column;gap:18px}
.pcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.big{font-family:var(--font-display);font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.attn{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.attn:last-child{border-bottom:0}
@media (max-width:760px){.pcards{grid-template-columns:1fr}}
@media (max-width:900px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3,.g2{grid-template-columns:1fr}
  .flow{grid-template-columns:repeat(3,minmax(0,1fr))}
  .flow div:nth-child(3){border-right:0}
  .flow div:nth-child(-n+3){border-bottom:1px solid var(--line)}
}
@media (max-width:480px){
  .g4{grid-template-columns:1fr 1fr}
  .flow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .flow div{border-right:1px solid var(--line)!important;border-bottom:1px solid var(--line)}
  .flow div:nth-child(2n){border-right:0!important}
  .flow div:nth-child(n+5){border-bottom:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- Tokens da casca e dos gráficos ---------- */
:root{--casca:#e9edf5;--ct:#f8f9fc;--c1:#e79a00;--c2:#13294b;--logo-c:block;--logo-e:none;--sombra:0 1px 2px rgba(19,41,75,.05),0 8px 24px rgba(19,41,75,.05)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--casca:#0a1220;--ct:#0e1626;--c1:#f5b72e;--c2:#7fa6e6;--logo-c:none;--logo-e:block;--sombra:none}}
:root[data-theme="dark"]{--casca:#0a1220;--ct:#0e1626;--c1:#f5b72e;--c2:#7fa6e6;--logo-c:none;--logo-e:block;--sombra:none}
.ic{width:18px;height:18px;flex:none}
.sm{font-size:.8rem}
.txt-bad{color:var(--bad);font-weight:600}
.logo.lg-c{display:var(--logo-c)} .logo.lg-e{display:var(--logo-e)}
.btn.gold{justify-content:center;background:var(--gold);border-color:var(--gold);color:var(--gold-ink);font-weight:700;padding:11px 16px;box-shadow:0 6px 16px rgba(245,168,0,.28)}
.btn.gold:hover{filter:brightness(1.05)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);font-weight:700}
.ptop .btn{background:transparent;color:var(--side-ink);border-color:rgba(255,255,255,.35)}
.ic-btn{display:inline-flex;align-items:center;justify-content:center;position:relative;width:36px;height:36px;flex:none;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;color:var(--ink)}
.ic-btn:hover{border-color:var(--brand)}
.panel{border-radius:14px;box-shadow:var(--sombra)}

/* ---------- Login ---------- */
.login-wrap{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.demo-banner + #app .login-wrap{min-height:calc(100vh - 34px)}
.login-side{position:relative;overflow:hidden;background:radial-gradient(90% 70% at 70% 0,#2a3f63 0,transparent 60%),linear-gradient(160deg,#0b1a33,#13294b 70%,#0e2040);color:#fff;padding:44px max(48px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.arcos{position:absolute;right:-120px;bottom:-160px;width:760px;height:760px;color:#f5a800;opacity:.14;pointer-events:none}
.ls-top,.ls-mid,.ls-rod{position:relative}
.ls-mid{display:flex;flex-direction:column;gap:16px}
.login-side .label{color:#f5b72e}
.login-side h1{font-size:clamp(2rem,3.4vw,3.05rem);line-height:1.06;max-width:15ch;letter-spacing:-.02em}
.ls-it{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:14px}
.ls-it li{display:flex;gap:14px;align-items:center}
.ls-it b{display:block;font-weight:600}
.ls-it small{color:#c9d2e3;font-size:.84rem}
.ls-i{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;flex:none;border:1px solid rgba(245,168,0,.35);border-radius:11px;background:rgba(245,168,0,.09);color:#f5b72e}
.login-side .ls-rod{color:#a5b3cc}
.login-main{display:flex;align-items:center;justify-content:center;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--casca)}
.login-card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:var(--sombra)}
.login-card p{margin:4px 0 0}
.login-ic{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;background:var(--ochre-soft);color:var(--ochre)}
.login-form{display:flex;flex-direction:column;gap:14px}
.passos{display:flex;gap:5px}
.passos i{width:26px;height:4px;border-radius:9px;background:var(--line)}
.passos i.on{background:var(--gold)}
.quem{display:flex;align-items:center;gap:10px;background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:.88rem}
.quem span:nth-child(2){flex:1;min-width:0;overflow-wrap:anywhere}
.code{font-size:1.3rem;letter-spacing:.4em;text-align:center}
.dica{font-size:.84rem;color:var(--ink-2)}
.dica summary{cursor:pointer}
.dica p{margin:6px 0 0}
.outro{display:inline-flex;gap:6px;align-items:center;color:var(--ink);font-weight:600;font-size:.86rem;text-decoration:none}
.outro:hover{text-decoration:underline}
.outro .ic{width:15px;height:15px}

/* ---------- Casca do portal ---------- */
.sh{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh;background:var(--casca)}
.sh.min{grid-template-columns:70px minmax(0,1fr)}
.sb{position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:16px 12px}
.sb-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-left:6px}
.sb-top .logo{height:44px}
.sb-busca{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;border-radius:9px;padding:8px;cursor:pointer;color:var(--ink-2)}
.sb-busca:hover{background:var(--surface)}
.sb-busca span{flex:1;text-align:left}
kbd{font:inherit;font-size:.7rem;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.nav{display:flex;flex-direction:column;gap:8px;flex:1}
.nv-g{display:flex;flex-direction:column;gap:2px}
.nv-t{display:flex;justify-content:space-between;align-items:center;border:0;background:none;cursor:pointer;padding:6px 8px;color:var(--ink-3);font-size:.71rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.nv-t .ic{width:13px;height:13px;transition:transform .15s}
.nv-t.ab .ic{transform:rotate(90deg)}
.nv-i{position:relative;display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;border-radius:9px;padding:8px;cursor:pointer;color:var(--ink);font-weight:500}
.nv-i span{flex:1;min-width:0}
.nv-i:hover{background:var(--surface)}
.nv-i.on{background:var(--ochre-soft);font-weight:700}
.nv-i.on::before{content:"";position:absolute;left:-12px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.nv-i.on .ic{color:var(--ochre)}
.nv-i em{font-style:normal;font-size:.7rem;font-weight:700;border-radius:99px;padding:0 7px;background:var(--bad-soft);color:var(--bad)}
.sb-sair{color:var(--ink-2)}
.sh.min .sb-top .logo,.sh.min .sb-busca span,.sh.min kbd,.sh.min .nv-t,.sh.min .nv-i span,.sh.min .nv-i em{display:none}
.sh.min .sb-top{justify-content:center;padding:0}
.sh.min .sb-busca,.sh.min .nv-i{justify-content:center}
.ct{margin:10px 10px 10px 0;background:var(--ct);border:1px solid var(--line);border-radius:20px;min-width:0;display:flex;flex-direction:column}
.topo{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 22px 0}
.crumb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.84rem;color:var(--ink-3);min-width:0}
.crumb i{font-style:normal}
.crumb .at{color:var(--ink);font-weight:600}
.fonte{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);border-radius:99px;padding:1px 9px;font-size:.72rem;font-weight:600}
.fonte::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink-3)}
.fonte.real{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.fonte.real::before{background:var(--ok)}
.topo-r{display:flex;align-items:center;gap:8px}
.sino em{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 4px;border-radius:99px;background:var(--bad);color:var(--surface);font-style:normal;font-size:.64rem;font-weight:700;line-height:18px;text-align:center}
.eu{position:relative}
.eu-b{display:flex;align-items:center;gap:9px;border:0;background:none;cursor:pointer;text-align:left;padding:2px}
.eu-n{display:flex;flex-direction:column;line-height:1.2;max-width:190px}
.eu-n b{font-size:.86rem}
.eu-n small{color:var(--ink-3);font-size:.73rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eu-m{display:none;position:absolute;right:0;top:calc(100% + 8px);z-index:20;width:250px;flex-direction:column;align-items:flex-start;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 12px 32px rgba(10,20,40,.18)}
.eu.open .eu-m{display:flex}
.eu-m hr{width:100%;border:0;border-top:1px solid var(--line);margin:4px 0}
.main{padding-block:14px 40px;padding-inline:22px;min-width:0;display:flex;flex-direction:column;gap:16px}
.mobile-top{display:none}
.logo{display:block;height:58px;width:auto;max-width:100%}
.overlay{backdrop-filter:blur(3px)}
.modal.wide{max-width:640px;border-radius:16px}
.linkbtn{color:var(--ink)}

/* ---------- Início e eventos ---------- */
.hats{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:.72rem;font-weight:600;border-radius:6px;padding:2px 7px;background:var(--brand-soft);color:var(--ink)}
.av{flex:none;display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--side);color:var(--gold);font-size:.7rem;font-weight:700}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.radar-b{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,var(--ochre-soft),var(--warn-soft));border-radius:14px;padding:10px 14px;flex-wrap:wrap}
.radar-b p{flex:1;min-width:180px;margin:0}
.radar-i{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:var(--side);color:var(--gold)}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(4,minmax(0,1fr))}
.tiles.t3{grid-template-columns:repeat(3,minmax(0,1fr))}
.tiles.t2{grid-template-columns:repeat(2,minmax(0,1fr))}
.tiles.t1{grid-template-columns:minmax(0,1fr)}
.tile{display:flex;flex-direction:column;gap:5px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;box-shadow:var(--sombra);min-width:0}
button.tile{cursor:pointer} button.tile:hover{border-color:var(--brand)}
.tile-h{display:flex;align-items:center;gap:8px;font-size:.84rem;font-weight:600}
.tile-i{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;flex:none;border-radius:8px;background:var(--ochre-soft);color:var(--ochre)}
.tile-i .ic{width:16px;height:16px}
.tile-v{font-family:var(--font-display);font-size:1.65rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.tile-v.is-bad{color:var(--bad)}
.tile-s{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.76rem}
.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.cols.c2{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.col:empty{display:none}
.grp{display:flex;flex-direction:column;gap:2px}
.grp h3{font-size:.84rem}
.grp.bad h3{color:var(--bad)}
.tks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tk{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.tk:last-child{border-bottom:0}
.tk.na{opacity:.55}
.tk-c{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--ink-3);background:none;color:var(--surface);cursor:pointer;font-size:.72rem;line-height:1;padding:0}
.tk-c:hover:not([disabled]){border-color:var(--ok);background:var(--ok-soft)}
.tk-c[disabled]{opacity:.35;cursor:not-allowed}
.tk.ok .tk-c{background:var(--ok);border-color:var(--ok)}
.tk.ok .tk-t{color:var(--ink-3);text-decoration:line-through}
.tk-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tk-t{font-weight:500}
.tk-s{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.78rem;color:var(--ink-3)}
.tk-n{font-size:.78rem;color:var(--ink-3);flex-basis:100%}
.tk-r{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tk-r select{border:1px solid var(--line);border-radius:7px;padding:3px 6px;background:var(--surface);font-size:.78rem;max-width:150px}
.evchip{background:var(--brand-soft);color:var(--ink);border-radius:5px;padding:0 6px;font-weight:600}
.dep{display:flex;gap:10px;align-items:flex-start}
.dbox{flex:none;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:44px;height:48px;border-radius:10px;background:var(--side);color:var(--side-ink);line-height:1}
.dbox b{font-family:var(--font-display);font-size:1.15rem}
.dbox small{font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;color:var(--gold);margin-top:3px}
.rd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;width:100%;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;padding:9px 0}
.rd:hover b{text-decoration:underline}
.rd-n{flex:1 1 150px;min-width:0;display:flex;flex-direction:column;font-size:.86rem}
.rd-t{flex:1 1 120px;display:flex;flex-direction:column;gap:3px;font-size:.74rem}
.trk{position:relative;display:block;height:8px;border-radius:99px;background:var(--surface-2);min-width:70px}
.trk i{display:block;height:100%;border-radius:99px;background:var(--c1)}
.trk em{position:absolute;top:-3px;bottom:-3px;width:3px;margin-left:-1px;border-radius:2px;background:var(--c2)}
.trk.fino{height:4px;margin-top:5px;max-width:260px}
.leg-t{display:flex;align-items:center;gap:6px;margin:0;font-size:.74rem;color:var(--ink-2)}
.k-fill{display:inline-block;width:18px;height:6px;border-radius:9px;background:var(--c1)}
.k-mark{display:inline-block;width:3px;height:12px;border-radius:2px;background:var(--c2);margin-left:10px}
.leg{display:inline-flex;gap:14px;font-size:.78rem;color:var(--ink-2)}
.leg span{display:inline-flex;align-items:center;gap:5px}
.leg i,.gg-k i{width:10px;height:10px;border-radius:3px;display:inline-block}
i.s1{background:var(--c1)} i.s2{background:var(--c2)}
.ch{position:relative;height:210px;margin:6px 0 0 54px}
.ch-g{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.ch-g em{position:absolute;right:calc(100% + 7px);top:-.7em;font-style:normal;font-size:.68rem;color:var(--ink-3);white-space:nowrap}
.ch-c{position:absolute;inset:0;display:flex;gap:3px}
.ch-w{position:relative;flex:1;min-width:0;height:100%;border-radius:6px}
.ch-w:hover,.ch-w:focus{background:var(--surface-2);outline:none}
.ch-w.now{background:var(--ochre-soft)}
.ch-b{position:absolute;inset:0 18% 0;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.ch-b i{display:block;min-height:2px;border-radius:4px 4px 1px 1px}
.ch-w small{position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);font-size:.66rem;color:var(--ink-3);white-space:nowrap}
.ch-tip{display:none;position:absolute;bottom:60%;left:50%;transform:translateX(-50%);z-index:5;width:170px;flex-direction:column;gap:2px;background:var(--side);color:#fff;border-radius:10px;padding:9px 11px;font-size:.76rem;pointer-events:none}
.ch-tip span{display:flex;justify-content:space-between;gap:8px}
.ch-w:hover .ch-tip,.ch-w:focus .ch-tip{display:flex}
.ch-w:first-child .ch-tip,.ch-w:nth-child(2) .ch-tip{left:0;transform:none}
.ch-w:last-child .ch-tip,.ch-w:nth-last-child(2) .ch-tip{left:auto;right:0;transform:none}
.ch + *{margin-top:18px}
.panel:has(.ch){padding-bottom:30px}
.gg{display:flex;justify-content:center}
.gg svg{width:100%;max-width:260px;height:auto}
.gg line{stroke-width:3.2;stroke-linecap:round}
.gg line.s1{stroke:var(--c1)} .gg line.s2{stroke:var(--c2)}
.gg-v{font-family:var(--font-display);font-size:30px;font-weight:700;fill:var(--ink)}
.gg-l{font-size:11px;fill:var(--ink-3)}
.gg-k{display:flex;flex-direction:column;gap:4px;font-size:.84rem}
.gg-k div{display:flex;justify-content:space-between;gap:8px}
.gg-k span{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
.gg-k p{margin:2px 0 0}
.hero{display:grid;grid-template-columns:230px minmax(0,1fr);border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface);box-shadow:var(--sombra)}
.hero-d{position:relative;display:flex;flex-direction:column;justify-content:center;gap:2px;padding:20px 24px;color:#fff;background:radial-gradient(90% 90% at 80% 0,#33486e 0,transparent 65%),linear-gradient(150deg,#0b1a33,#13294b)}
.hero-d .label{color:#f5b72e}
.hero-d b{font-family:var(--font-display);font-size:4rem;line-height:1;color:#f5b72e}
.hero-b{display:flex;flex-direction:column;gap:9px;padding:20px 24px;min-width:0}
.hero-b h2{font-size:1.4rem}
.hero-c{display:flex;gap:6px;flex-wrap:wrap}
.hero-m{display:flex;gap:6px 16px;flex-wrap:wrap;margin:0;font-size:.86rem}
.hero-m span{display:inline-flex;gap:6px;align-items:center}
.hero-m .ic{width:15px;height:15px;color:var(--ochre)}
.busca-l{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:0 10px;color:var(--ink-3)}
.busca-l input{flex:1;min-width:0;border:0;background:none;padding:9px 0;outline:none;color:var(--ink)}
.td-ev{display:flex;align-items:center;gap:10px}
.ev-h{display:flex;gap:12px;align-items:center;min-width:0}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-weight:600;font-size:.82rem;cursor:pointer}
.chipbtn.on{background:var(--side);color:var(--side-ink);border-color:var(--side)}
.vez{display:flex;align-items:center;gap:12px;background:var(--ochre-soft);border-radius:14px;padding:11px 16px;flex-wrap:wrap}
.vez>div{flex:1;min-width:180px}
.vez .label{color:var(--ochre)}
.vez-t{font-family:var(--font-display);font-weight:600;font-size:1.02rem}
.regua-w{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 14px 12px;box-shadow:var(--sombra)}
.regua{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(118px,1fr));min-width:720px}
.regua li{position:relative;display:flex;flex-direction:column;gap:2px;padding:0 8px;font-size:.76rem}
.regua li b{font-size:.84rem;line-height:1.2;margin-top:6px}
.regua li::before{content:"";position:absolute;top:10px;left:0;right:0;height:3px;background:var(--line)}
.regua li.feita::before{background:var(--ok)} .regua li.atrasada::before{background:var(--bad)} .regua li.agora::before{background:var(--gold)}
.regua .dot{position:relative;z-index:1;width:23px;height:23px;border-radius:50%;background:var(--surface);border:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700}
.regua li.feita .dot{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.regua li.atrasada .dot{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.regua li.agora .dot{border-color:var(--gold)}
.pg{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.pg:last-of-type{border-bottom:0}
.pg-d{flex:0 0 46px;display:flex;flex-direction:column;font-size:.84rem}
.pg-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pg-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.totais{display:flex;gap:18px;flex-wrap:wrap;justify-content:flex-end;font-size:.88rem;border-top:2px solid var(--line);padding-top:10px}
.sem{border:1px solid var(--line);border-radius:12px;padding:0 12px}
.sem summary{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;cursor:pointer;padding:11px 0}
.sem[open] summary{border-bottom:1px solid var(--line)}
.kv{display:grid;grid-template-columns:170px minmax(0,1fr);gap:8px 14px;margin:0}
.kv dt{color:var(--ink-3);font-size:.84rem}
.kv dd{margin:0}
.mes{min-width:130px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal>b{font-size:.72rem;color:var(--ink-3);text-align:center;padding-bottom:2px}
.cd{min-height:88px;display:flex;flex-direction:column;gap:3px;border:1px solid var(--line);border-radius:9px;padding:5px;min-width:0}
.cd.off{border:0}
.cd.hj{border:2px solid var(--gold)}
.cd-n{font-size:.76rem;color:var(--ink-3)}
.cd-e{border:0;background:var(--side);color:var(--side-ink);border-radius:5px;padding:2px 5px;font-size:.7rem;font-weight:600;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd-p{font-size:.68rem;color:var(--ochre);font-weight:600}
.pri{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.pri>div{display:flex;flex-direction:column;min-width:0}
.bsc{width:100%;border:2px solid var(--gold);border-radius:10px;padding:11px 13px;background:var(--surface);outline:none}
.bsc-g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:52vh;overflow:auto}
.bsc-i{display:flex;flex-direction:column;align-items:flex-start;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 12px;cursor:pointer;text-align:left}
.bsc-i:hover{border-color:var(--brand)}
/* Contrato e cortesias */
.regras-l{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:.82rem;color:var(--ink-2)}
.conv-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0;min-width:0}
.conv-row legend{font-size:.8rem;font-weight:600;padding:0 6px}
@media (max-width:560px){.conv-row{grid-template-columns:minmax(0,1fr)}}

@media (max-width:1040px){.cols,.cols.c2{grid-template-columns:minmax(0,1fr)}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  .login-wrap{grid-template-columns:1fr}
  .login-side{padding:24px max(16px,env(safe-area-inset-left,0px));gap:14px}
  .login-side h1{font-size:1.55rem}
  .ls-it,.ls-rod,.arcos{display:none}
  .sh,.sh.min{grid-template-columns:minmax(0,1fr)}
  .sb{display:none}
  .sb.open{display:flex;position:fixed;inset:0;z-index:40;height:100%;background:var(--casca);padding-top:calc(16px + env(safe-area-inset-top,0px))}
  .sb.open .nv-t,.sb.open .nv-i span{display:flex}
  .sb-busca kbd{display:none}
  .mobile-top{display:flex;justify-content:space-between;align-items:center;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--side);color:var(--side-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
  .mt-l .logo{height:36px}
  .mobile-top .btn{background:transparent;color:var(--side-ink);border-color:rgba(255,255,255,.35)}
  .ct{margin:0;border:0;border-radius:0}
  .topo{padding:12px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
  .eu-n{display:none}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .sem-celular{display:none}
  th,td{padding-left:6px;padding-right:6px}
  .timeline li{grid-template-columns:1fr;gap:2px}
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero-d{flex-direction:row;align-items:baseline;gap:8px;padding:14px 18px}
  .hero-d b{font-size:2.2rem}
  .hero-b{padding:16px 18px}
  .kv{grid-template-columns:minmax(0,1fr);gap:2px}
  .kv dd{margin-bottom:8px}
  .cd{min-height:58px;padding:3px}
  .cd-e{font-size:.6rem;padding:1px 3px}
  .cd-p{font-size:.58rem}
  .bsc-g{grid-template-columns:minmax(0,1fr)}
  .pg{flex-wrap:wrap}
  .pg-r{width:100%;padding-left:58px;justify-content:flex-start}
  .ch{margin-left:46px}
  .ch-w:nth-child(even) small{display:none}
}
@media (max-width:560px){.tk{flex-wrap:wrap}.tk-r{width:100%;padding-left:34px;justify-content:flex-start}.tk-r select{max-width:44%}}
@media (max-width:420px){.tiles,.tiles.t3{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{padding:11px 12px}.tile-v{font-size:1.3rem}}

.outro{display:none!important}
</style>

window.ICCalendario = function(h){
  const d = n => h.iso(h.addDays(h.today, n));
  // [id, nome, curto, dias a partir de hoje, dias de duração, horário, local, público, aberto, coordenação]
  const L = [
    ["forum-incorporacao","Fórum de Incorporação de Tecnologias na Saúde","Incorporação de Tecnologias",-30,0,"9h às 13h","Auditório","95 presentes",true],
    ["mesa-pacientes","Mesa-redonda: Direitos dos Pacientes e Acesso","Direitos dos Pacientes",-12,0,"10h às 12h","Auditório","48 presentes",true],
    ["seminario-financiamento","Seminário Financiamento da Saúde Suplementar","Financiamento da Saúde",4,0,"9h às 13h","Auditório","80 pessoas",true],
    ["debate-ia","Debate: Regulação da Inteligência Artificial na Saúde","IA e Regulação",11,0,"9h às 12h","Auditório","60 pessoas",true],
    ["simposio-judicializacao","Simpósio de Judicialização da Saúde","Simpósio Judicialização",25,1,"Dia 1 das 8h às 18h; dia 2 até 13h","Estrutura montada","150 pessoas",true],
    ["forum-regulacao","Fórum de Regulação e Acesso a Medicamentos","Regulação e Acesso",48,0,"9h às 14h","Auditório","120 pessoas",true]
  ];

};

</script>
<script>
window.ICOperacao = (function(){
  function cal(h){
    var c = window.ICCalendario ? window.ICCalendario(h) : [];
    // so eventos abertos, e sem o nome de quem coordena
    return c.filter(function(e){ return e.aberto; }).map(function(e){ return {id:e.id,nome:e.nome,curto:e.curto,data:e.data,fim:e.fim,horario:e.horario,local:e.local,publico:e.publico,aberto:true,coord:""}; });
  }
  return {
    usuarios: function(){ return []; },
    seed: function(h){ return {daily:null, calendario:cal(h)}; },
    hidratar: function(S,h){ if(!S.calendario){ S.calendario = cal(h); return true; } return false; },
    init: function(){ return {click:function(){return false;}, change:function(){return false;}, real:function(){return false;}}; },
    calendario: cal
  };
})();

/* ---------------- Regras ---------------- */
const cat = p=>S.categories.find(c=>c.id===p.catId);
function parcelaStatus(x){
  if(x.cancelada) return {t:"cancelada",c:"p-neutral",d:0};
  if(x.pago) return {t:"paga",c:"p-ok",d:0};
  const d = Math.floor((today - parse(x.venc))/DAY);
  if(d>0) return {t:"vencida há "+d+" d",c:"p-bad",d};
  if(d===0) return {t:"vence hoje",c:"p-warn",d};
  if(d>-15) return {t:"vence em "+(-d)+" d",c:"p-warn",d};
  return {t:"a vencer",c:"p-neutral",d};
}
function fin(p){
  const pago = p.parcelas.reduce((s,x)=>s+(x.pago?x.pago.valor-(x.pago.enc||0):0),0); // sem multa e juros: só o valor do contrato
  const atrasadas = p.parcelas.filter(x=>!x.pago&&!x.cancelada&&parse(x.venc)<today);
  const maxAtraso = atrasadas.reduce((m,x)=>Math.max(m,Math.floor((today-parse(x.venc))/DAY)),0);
  const emAtraso = atrasadas.reduce((s,x)=>s+x.valor,0);
  const atualizado = atrasadas.reduce((s,x)=>s+encargos(x).total,0); // com multa e juros
  const prox = p.parcelas.filter(x=>!x.pago&&!x.cancelada&&parse(x.venc)>=today).sort((a,b)=>a.venc.localeCompare(b.venc))[0];
  return {pago, emAtraso, atualizado, maxAtraso, atrasadas, prox};
}

function regua(p){ const f=fin(p); if(p.suspenso) return {t:"Contrapartidas suspensas",c:"p-bad"}; if(f.maxAtraso>60) return {t:"Mais de 60 dias: antecipar ou resolver",c:"p-bad"}; if(f.maxAtraso>30) return {t:"Mais de 30 dias: pode suspender",c:"p-warn"}; if(f.maxAtraso>0) return {t:"Parcela vencida",c:"p-warn"}; return {t:"Em dia",c:"p-ok"}; }
/* Cortesias: quanto o contrato dá por evento aberto, quanto já foi pedido e até quando se pode pedir */
const cortQtd = p=>(p.benefits.find(b=>b.type==="convite")||{qty:0}).qty;
const eventosCal = ()=>(S.calendario||[]).slice().sort((a,b)=>a.data.localeCompare(b.data));
const fimEvento = e=>parse(e.fim||e.data);
const prazoCortesia = e=>duAntes(parse(e.data),PRAZO_CORTESIA);
const cortDoEvento = (p,evId)=>(p.cortesias||[]).filter(c=>c.ev===evId&&c.status!=="recusada"&&c.status!=="cancelada");
const cortUsadas = (p,evId)=>cortDoEvento(p,evId).reduce((s,c)=>s+c.convidados.length,0);
const diasFim = p=>Math.ceil((parse(p.fim)-today)/DAY);
const saldo = b=>Math.max(0,b.qty-b.used);
const unit = b=> b.type==="horas"?"h": b.type==="usos"?(b.qty===1?"uso":"usos"): b.type==="convite"?"por evento": (b.un||"");
function benefitsLine(p){ const sp=p.benefits.filter(b=>b.type==="horas"||b.type==="usos"); const tot=sp.reduce((s,b)=>s+b.qty,0), used=sp.reduce((s,b)=>s+b.used,0), disp=sp.reduce((s,b)=>s+saldo(b),0); return {tot,used,disp}; }

function doLogin(email, senha){
  ui.pendingEmail = email;
  const lockUntil = S.locks[email];
  if(lockUntil && lockUntil>Date.now()){ const min=Math.ceil((lockUntil-Date.now())/60000); ui.msg={k:"err",t:`Conta bloqueada por excesso de tentativas. Tente de novo em ${min} min ou use "Esqueci minha senha".`}; render(); return; }
  const u = S.users.find(x=>x.email===email);
  if(!u || u.senha!==senha){
    S.attempts[email]=(S.attempts[email]||0)+1;
    S.log.unshift({ts:Date.now(),user:email||"(vazio)",acao:"Falha de login",alvo:"Tela de login",antes:"",depois:"tentativa "+S.attempts[email]});
    if(S.attempts[email]>=5){ S.locks[email]=Date.now()+15*60000; S.attempts[email]=0; ui.msg={k:"err",t:"Conta bloqueada por 15 minutos após 5 tentativas. Use \"Esqueci minha senha\" para desbloquear."}; }
    else ui.msg={k:"err",t:`E-mail ou senha incorretos. Restam ${5-S.attempts[email]} tentativas antes do bloqueio.`};
    save(); render(); return;
  }
  if(PORTAL==="equipe" && !u.interno){ ui.msg={k:"err",t:"Este é o portal da equipe do Instituto. Patrocinadores entram pelo Portal do Patrocinador, no link enviado pelo Instituto."}; render(); return; }
  if(PORTAL!=="equipe" && u.interno){ ui.msg={k:"err",t:"Contas da equipe do Instituto entram pelo Portal da equipe."}; render(); return; }
  S.attempts[email]=0; ui.msg=null;
  if(u.interno){ ui.screen="2fa"; render(); return; }
  session=email; logA("Login","Área do parceiro","","sucesso"); save(); ui.view="inicio"; render();
}

/* "6 parcelas mensais: a 1ª de R$ 50.000 e 5 de R$ 10.000" */
function descreverParcelas(p){
  const v=p.parcelas.map(x=>x.valor); if(!v.length) return "sem cobrança";
  const grupos=[]; v.forEach(x=>{ const g=grupos[grupos.length-1]; if(g&&g.v===x) g.n++; else grupos.push({v:x,n:1}); });
  const partes=grupos.map((g,i)=>g.n===1?(i===0?"a 1ª de ":"uma de ")+brl(g.v):g.n+" de "+brl(g.v));
  return pl(v.length,"parcela","parcelas")+" · "+(v.length>1?partes.join(" e "):brl(v[0]))+", total "+brl(p.valor);
}

function openCortesia(p, evId){
  const e=(S.calendario||[]).find(x=>x.id===evId), interno=me().interno;
  if(!e||!e.aberto){ toast("Este evento é reservado: não há cortesias."); return; }
  if(p.suspenso){ toast("Contrapartidas suspensas: não dá para pedir cortesias."); return; }
  const falta=cortQtd(p)-cortUsadas(p,evId), prazo=prazoCortesia(e), passou=today>prazo;
  if(falta<=0){ toast("Todas as cortesias deste evento já foram pedidas."); return; }
  if(passou&&!interno){ toast("O prazo para pedir terminou em "+fmtD(prazo)+"."); return; }
  const linhas=Array.from({length:falta},(_,i)=>`<fieldset class="conv-row"><legend>Convidado ${i+1}${i?" (opcional)":""}</legend>
    <div class="field"><label for="cn${i}">Nome completo</label><input id="cn${i}" autocomplete="off"></div>
    <div class="field"><label for="cd${i}">Documento (CPF ou RG)</label><input id="cd${i}" autocomplete="off"></div>
    <div class="field"><label for="cc${i}">Cargo</label><input id="cc${i}" autocomplete="off"></div>
    <div class="field"><label for="ci${i}">Instituição</label><input id="ci${i}" value="${esc(p.fantasia)}" autocomplete="off"></div></fieldset>`).join("");
  modal(`<h2>Pedir cortesias</h2><p class="muted" style="margin:0">${esc(p.fantasia)} · ${esc(e.nome)} · ${fmtD(e.data)}</p>
  <div class="info">Você ainda pode pedir até <b>${falta}</b>. As cortesias são pessoais e não podem ser vendidas nem cedidas. O Instituto pode recusar por segurança, capacidade ou conflito de interesses.</div>
  ${passou?`<div class="err">O prazo (5 dias úteis antes do evento) terminou em ${fmtD(prazo)}. Só o Instituto pode registrar como exceção.</div><label class="check"><input type="checkbox" id="cx"> Registrar como exceção do Instituto</label>`:""}
  ${linhas}
  <div class="actions"><button type="button" class="btn" data-close>Cancelar</button><button class="btn primary" type="submit">${interno?"Registrar":"Enviar pedido"}</button></div>`,
  f=>{
    const lista=[];
    for(let i=0;i<falta;i++){ const g={nome:f["cn"+i].value.trim(),doc:f["cd"+i].value.trim(),cargo:f["cc"+i].value.trim(),inst:f["ci"+i].value.trim()};
      const preenchido=g.nome||g.doc||g.cargo;
      if(!preenchido) continue;
      if(!g.nome||!g.doc||!g.cargo||!g.inst) return `Convidado ${i+1}: preencha nome, documento, cargo e instituição.`;
      lista.push(g); }
    if(!lista.length) return "Informe pelo menos um convidado.";

    p.cortesias=p.cortesias||[];
    p.cortesias.push({id:uid(), ev:evId, status:interno?"confirmada":"solicitada", em:iso(today), por:me().nome, convidados:lista, obs:passou?"Registrado fora do prazo, como exceção do Instituto":""});

  });
}

/* ---------------- Modais ---------------- */
function modal(html, onSubmit){
  const o=document.createElement("div"); o.className="overlay"; o.innerHTML=`<form class="modal" novalidate>${html}</form>`;
  document.body.appendChild(o);
  const form=o.querySelector("form");
  const close=()=>{ o.remove(); if(syncPendente){ syncPendente=false; load(); render(); } };
  o.addEventListener("click",e=>{ if(e.target===o||e.target.dataset.close!==undefined) close(); });
  document.addEventListener("keydown",function k(e){ if(e.key==="Escape"){ close(); document.removeEventListener("keydown",k);} });
  form.addEventListener("submit",e=>{ e.preventDefault(); const err=onSubmit(form); if(err){ let el=form.querySelector(".err"); if(!el){ el=document.createElement("div"); el.className="err"; form.insertBefore(el, form.querySelector(".actions")); } el.textContent=err; return; } close(); render(); });
  const first=form.querySelector("input,select,textarea"); if(first) first.focus();
}
function toast(t){ const el=document.createElement("div"); el.className="toast"; el.textContent=t; el.setAttribute("role","status"); document.body.appendChild(el); setTimeout(()=>el.remove(),3200); }

function openConsumo(p,b){
  modal(`<h2>Lançar consumo</h2><p class="muted" style="margin:0">${esc(p.fantasia)} · ${esc(b.name)} · saldo atual <b>${saldo(b)} ${unit(b)}</b></p>
  <div class="field"><label for="mtipo">Tipo de lançamento</label><select id="mtipo"><option value="c">Consumo</option><option value="e">Estorno (devolver saldo)</option></select></div>
  <div class="field"><label for="mqtd">Quantidade (${unit(b)||"entregas"})</label><input id="mqtd" type="number" min="1" value="1"></div>

  <div class="field"><label for="morig">Origem</label><select id="morig"><option>Lançamento manual</option><option>Reserva confirmada por escrito</option><option>Cancelamento com menos de 48 h</option><option>Não comparecimento</option><option>Entrega registrada</option></select></div>
  ${b.type==="usos"?`<div class="grid g2"><div class="field"><label for="mhoras">Duração do uso (horas, máx. ${LIMITE_HORAS_USO})</label><input id="mhoras" type="number" min="1" max="${LIMITE_HORAS_USO}" value="2"></div>${b.k==="sala"?`<div class="field"><label for="mpess">Pessoas (máx. ${LIMITE_SALA})</label><input id="mpess" type="number" min="1" value="8"></div>`:""}</div>
  <p class="faint" style="margin:0;font-size:.8rem">Reservas futuras pedem 10 dias úteis de antecedência (item 10.2). Cancelar com menos de 48 horas ou faltar conta como uso (item 10.3): escolha a origem correspondente.</p>`:""}
  <div class="field"><label for="mobs">Justificativa (obrigatória)</label><textarea id="mobs" rows="2" placeholder="Ex.: reunião do conselho em 12/11, sala 2"></textarea></div>
  <div class="actions"><button type="button" class="btn" data-close>Cancelar</button><button class="btn primary" type="submit">Lançar</button></div>`,
  f=>{
    const q=parseInt(f.mqtd.value,10), est=f.mtipo.value==="e", obs=f.mobs.value.trim();
    if(!q||q<1) return "Informe uma quantidade maior que zero.";
    if(!obs) return "Escreva a justificativa. Ela fica registrada na auditoria.";
    if(est && q>b.used) return `Não dá para estornar mais do que foi usado (${b.used}).`;
    if(!est && b.type==="usos"){
      const h=parseInt(f.mhoras.value,10);
      if(!h||h<1||h>LIMITE_HORAS_USO) return `Cada uso vale até ${LIMITE_HORAS_USO} horas (item 10.1).`;
      if(b.k==="sala"&&(parseInt(f.mpess.value,10)||0)>LIMITE_SALA) return `A sala de reuniões comporta até ${LIMITE_SALA} pessoas (item 10.8).`;
      const dia=f.mdata.value?parse(f.mdata.value):today;
      if(dia>today && today>duAntes(dia,PRAZO_RESERVA) && !f.dataset.prazo){ f.dataset.prazo="1"; return `A reserva precisa de 10 dias úteis de antecedência (item 10.2): o último dia para pedir era ${fmtD(duAntes(dia,PRAZO_RESERVA))}. Clique em Lançar de novo para registrar como exceção do Instituto.`; }
    }
    const antes=saldo(b);
    if(!est && q>saldo(b) && !f.dataset.ok){ f.dataset.ok="1"; return `O saldo é ${saldo(b)} e você está lançando ${q}. Clique em Lançar de novo para registrar como exceção.`; }
    b.used += est?-q:q;
    p.consumos.push({id:uid(),data:f.mdata.value||iso(today),bid:b.id,qtd:est?-q:q,origem:est?"Estorno manual":f.morig.value,por:me().nome,obs});
    logA(est?"Estorno de benefício":"Consumo de benefício", p.fantasia+" · "+b.name, "saldo "+antes, "saldo "+saldo(b)+(f.dataset.ok&&!est?" (exceção de saldo)":"")+(f.dataset.prazo&&!est?" (exceção de prazo)":"")+" · "+obs);
    save(); toast(est?"Estorno registrado.":"Consumo lançado. O saldo foi atualizado.");
  });
}

  f=>{ if(!f.rn.value.trim()||!/^\S+@\S+\.\S+$/.test(f.re.value)) return "Preencha pelo menos nome e um e-mail válido."; p.reps.push({nome:f.rn.value.trim(),cargo:f.rc.value.trim(),email:f.re.value.trim().toLowerCase(),cel:f.rt.value.trim()}); logA("Representante cadastrado", p.fantasia, "", f.rn.value.trim()+(f.rl.checked?" · convite enviado (simulado)":"")); save(); toast(f.rl.checked?"Representante adicionado. Convite simulado enviado.":"Representante adicionado."); });
}
function openNewPartner(){
  modal(`<h2>Novo parceiro</h2>
  <div class="field"><label for="nf">Nome fantasia</label><input id="nf"></div>
  <div class="field"><label for="nr">Razão social</label><input id="nr"></div>
  <div class="field"><label for="nc">CNPJ</label><input id="nc" placeholder="00.000.000/0000-00"></div>
  <div class="field"><label for="nk">Categoria</label><select id="nk">${S.categories.map(c=>`<option value="${c.id}">${c.name}${c.value?" · "+brl(c.value):""}</option>`).join("")}</select></div>
  <div class="field"><label for="ni">Início da vigência</label><input id="ni" type="date" value="${iso(today)}"></div>
  <div class="field"><label for="np">Número de parcelas</label><select id="np">${[1,2,4,10,12].map(n=>`<option ${n===4?"selected":""}>${n}</option>`).join("")}</select></div>
  <p class="faint" style="margin:0;font-size:.8rem">A Cota Bronze segue o plano da minuta e ignora este campo: 6 parcelas mensais, a 1ª de 50% e as 5 seguintes de 10%, a 1ª vencendo 8 dias depois do início.</p>
  <div class="actions"><button type="button" class="btn" data-close>Cancelar</button><button class="btn primary" type="submit">Criar contrato</button></div>`,
  f=>{
    if(!f.nf.value.trim()) return "Informe o nome fantasia.";
    if(!/^\d{2}\.?\d{3}\.?\d{3}\/?\d{4}-?\d{2}$/.test(f.nc.value.trim())) return "CNPJ inválido. Use o formato 00.000.000/0000-00.";
    const c=S.categories.find(x=>x.id===f.nk.value), ini=parse(f.ni.value||iso(today)), n=parseInt(f.np.value,10);
    if(c.id==="ade"&&n>10) return "O Associado Aderente pode parcelar em até 10 vezes.";
    // Cota com plano próprio (Bronze): 1ª parcela 8 dias depois do início, mensais no mesmo dia, como na minuta.
    // Demais cotas: vencimento sempre no dia 10; se o contrato começa depois do dia 10, a primeira parcela vai para o mês seguinte.
    const base=addMonths(new Date(ini.getFullYear(),ini.getMonth(),1), ini.getDate()>10?1:0), valorParc=Math.round(c.value/n);
    let parcelas=[];
    if(c.value&&c.plano){ let soma=0; parcelas=c.plano.map((fr,i,a)=>{const v=i===a.length-1?c.value-soma:Math.round(c.value*fr); soma+=v; return {id:uid(),n:i+1,venc:iso(addMonths(addDays(ini,8),i)),valor:v,pago:null,boleto:false,nf:false};}); }
    else if(c.value) parcelas=Array.from({length:n},(_,i)=>{const v=addMonths(base,Math.round(i*12/n)); v.setDate(10); return {id:uid(),n:i+1,venc:iso(v),valor:i===n-1?c.value-valorParc*(n-1):valorParc,pago:null,boleto:false,nf:false};});
    const p={id:"p"+uid(),fantasia:f.nf.value.trim(),razao:f.nr.value.trim()||f.nf.value.trim(),cnpj:f.nc.value.trim(),catId:c.id,cidade:"",endereco:"",inicio:iso(ini),fim:iso(addMonths(ini,12)),valor:c.value,statusContrato:"Rascunho",suspenso:false,reps:[],
      contrato:{numero:CODIGO_COTA[c.id]?"IC-PAT-"+CODIGO_COTA[c.id]+" v1.1":"",assinatura:iso(today),legais:[],notificacoes:[],gestor:null,faturamento:""},cortesias:[],
      benefits:c.benefits.map(b=>({id:uid(),k:b.k,name:b.name,type:b.type,qty:b.qty,used:0,un:b.un,resp:b.k==="rel"?"Contratos":b.type==="entrega"?"Comunicação":"Operacional",obs:""})),
      parcelas,
      docs:[],consumos:[],tarefas:[],hist:[]};
    S.partners.push(p); logA("Parceiro cadastrado", p.fantasia, "", c.name+" · "+(c.value?pl(p.parcelas.length,"parcela","parcelas"):"sem cobrança")); save(); ui.view="parceiro"; ui.pid=p.id; ui.tab="beneficios"; toast("Parceiro criado com o pacote da categoria "+c.name+".");
  });
}
function openReport(p){
  const f=fin(p), showFin = !me().interno || can.fin();
  const o=document.createElement("div"); o.className="overlay";
  o.innerHTML=`<div class="modal" style="max-width:640px"><div class="panel-h"><div><span class="label">Relatório de parceria · parcial</span><h2>${esc(p.fantasia)}</h2><p class="muted" style="margin:0">${cat(p).name} · ${fmtD(p.inicio)} a ${fmtD(p.fim)}</p></div></div>
  ${showFin?`<div><h3>Pagamentos</h3><p class="muted" style="margin:4px 0 0">${p.parcelas.filter(x=>x.pago).length} de ${p.parcelas.length} parcelas pagas · ${brl(f.pago)} de ${brl(p.valor)} · ${p.parcelas.filter(x=>x.nf).length} notas fiscais emitidas</p></div>`:""}
  <div><h3>Benefícios utilizados</h3><div class="tbl-wrap"><table><thead><tr><th>Benefício</th><th class="n">Contratado</th><th class="n">Usado</th><th class="n">Não utilizado</th></tr></thead><tbody>${p.benefits.filter(b=>b.type!=="convite"&&b.qty>0).map(b=>`<tr><td>${esc(b.name)}</td><td class="n">${b.qty} ${unit(b)}</td><td class="n">${b.used}</td><td class="n">${saldo(b)}</td></tr>`).join("")}</tbody></table></div></div>
  <div><h3>Cortesias em eventos</h3><p class="muted" style="margin:4px 0 0">${cortQtd(p)?`${(p.cortesias||[]).filter(c=>c.status==="confirmada").reduce((s,c)=>s+c.convidados.length,0)} cortesias confirmadas em ${new Set((p.cortesias||[]).filter(c=>c.status==="confirmada").map(c=>c.ev)).size} eventos (até ${cortQtd(p)} por evento aberto).`:"Esta cota não prevê cortesias."}</p></div>
  <p class="faint" style="margin:0;font-size:.8rem">O relatório anual completo das contrapartidas executadas deve ser enviado até ${fmtD(addDays(parse(p.fim),60))}, 60 dias depois do fim da vigência (item 6.6). Na versão real ele sai em PDF com a identidade visual do Instituto.</p>
  <div class="actions"><button class="btn primary" type="button" data-close>Fechar</button></div></div>`;
  document.body.appendChild(o);
  o.addEventListener("click",e=>{ if(e.target===o||e.target.dataset.close!==undefined) o.remove(); });
  logA("Relatório gerado", p.fantasia, "", "parcial"); save();
}

/* ---------------- Eventos ---------------- */
document.addEventListener("click", e=>{
  const t=e.target.closest("[data-a]"); if(!t) return;
  if(OP.click(t.dataset.a,t)) return;
  const a=t.dataset.a, P=id=>S.partners.find(p=>p.id===id);
  if(a==="togglepw"){ const i=document.getElementById("senha"); i.type=i.type==="password"?"text":"password"; t.textContent=i.type==="password"?"Mostrar":"Ocultar"; return; }
  if(a==="forgot"){ ui.screen="forgot"; ui.msg=null; render(); return; }
  if(a==="back"){ ui.screen="login"; ui.msg=null; render(); return; }
  if(a==="accept"){ if(!document.getElementById("acc1").checked||!document.getElementById("acc2").checked){ toast("Marque as duas caixas para continuar."); return; } const u=me(); u.termos=true; logA("Aceite de termos", "Área do parceiro", "", "termos v1 aceitos"); save(); render(); return; }
  if(a==="logout"){ logA("Logout", me()?(me().interno?"Painel administrativo":"Área do parceiro"):"", "", ""); save(); session=null; ui=uiInicial(); render(); return; }
  if(a==="menu"){ ui.menu=!ui.menu; render(); return; }
  if(a==="grp"){ ui.grupos[t.dataset.g]=!grupoAberto(t.dataset.g); render(); return; }
  if(a==="sidemin"){ ui.sideMin=!ui.sideMin; render(); return; }
  if(a==="usermenu"){ ui.userMenu=!ui.userMenu; render(); return; }
  if(a==="tema"){ trocarTema(); render(); return; }
  if(a==="reset"){ restaurar(); return; }
  if(a==="nav"){ document.querySelectorAll(".overlay").forEach(o=>o.remove()); ui.view=t.dataset.v; ui.menu=false; ui.userMenu=false; render(); window.scrollTo(0,0); return; }
  if(a==="open"){ ui.view="parceiro"; ui.pid=t.dataset.id; ui.tab="beneficios"; ui.menu=false; render(); window.scrollTo(0,0); return; }
  if(a==="tab"){ ui.tab=t.dataset.t; render(); return; }
  if(a==="consumo"){ const p=P(t.dataset.id); openConsumo(p,p.benefits.find(b=>b.id===t.dataset.b)); return; }
  if(a==="adjust"){ const p=P(t.dataset.id); openAdjust(p,p.benefits.find(b=>b.id===t.dataset.b)); return; }
  if(a==="pay"){ const p=P(t.dataset.id); openPay(p,p.parcelas.find(x=>x.id===t.dataset.x)); return; }
  if(a==="upload"){ openUpload(P(t.dataset.id)); return; }
  if(a==="addRep"){ openRep(P(t.dataset.id)); return; }
  if(a==="newPartner"){ openNewPartner(); return; }
  if(a==="report"){ openReport(P(t.dataset.id)); return; }
  if(a==="suspend"){ if(!me().interno||!can.admin()) return; const p=P(t.dataset.id); p.suspenso=!p.suspenso; logA(p.suspenso?"Contrapartidas suspensas":"Contrapartidas reativadas", p.fantasia, p.suspenso?"ativas":"suspensas", p.suspenso?"suspensas por atraso acima de 30 dias (item 4.6)":"ativas"); save(); toast(p.suspenso?"Contrapartidas suspensas. O parceiro foi avisado (simulado). A vigência não é prorrogada.":"Contrapartidas reativadas."); render(); return; }
  if(a==="cort-new"){ const p=P(t.dataset.id); if(!p||(!me().interno&&me().partnerId!==p.id)) return; openCortesia(p,t.dataset.e); return; }
  if(a==="cort-ok"||a==="cort-no"||a==="cort-cancel"){
    const p=P(t.dataset.id), c=p&&(p.cortesias||[]).find(x=>x.id===t.dataset.c); if(!c||(!me().interno&&me().partnerId!==p.id)) return;
    if(a==="cort-cancel"){ if(c.status!=="solicitada") return; c.status="cancelada"; c.obs="Cancelado por "+me().nome; logA("Pedido de cortesias cancelado", p.fantasia+" · "+nomeEv(c.ev), "solicitada", "cancelada"); save(); toast("Pedido cancelado."); render(); return; }
    if(!me().interno||!can.cort()||c.status!=="solicitada") return;
    if(a==="cort-ok"){ c.status="confirmada"; c.obs="Confirmado por "+me().nome+" em "+fmtD(today); logA("Cortesias confirmadas", p.fantasia+" · "+nomeEv(c.ev), "solicitada", pl(c.convidados.length,"convidado","convidados")); save(); toast("Cortesias confirmadas. O patrocinador vê a confirmação."); render(); return; }
    openRecusa(p,c); return; }
  if(a==="done"){ const p=P(t.dataset.id); const x=p.tarefas.find(k=>k.id===t.dataset.t); x.status="concluída"; logA("Pendência concluída", p.fantasia, "", x.texto); save(); render(); return; }
  if(a==="dl"){ if(me()) { const dono=P(me().interno?ui.pid:me().partnerId); logA("Download de documento", (dono?dono.fantasia+" · ":"")+t.dataset.n, "", "link temporário (15 min)"); save(); } toast("Download simulado: "+t.dataset.n+". Na versão real, abre por link temporário."); return; }
  if(a==="noop"){ toast(t.dataset.m||"Ação simulada."); return; }
});
document.addEventListener("input", e=>{
  if(e.target.id==="fq"){ ui.q=e.target.value; const pos=e.target.selectionStart; render(); const n=document.getElementById("fq"); n.focus(); n.setSelectionRange(pos,pos); }
});
document.addEventListener("change", e=>{
  if(OP.change(e.target)) return;
  if(e.target.id==="fcat"){ ui.fcat=e.target.value; render(); }
  if(e.target.id==="fstat"){ ui.fstat=e.target.value; render(); }
  if(e.target.classList.contains("catqty")){ const c=S.categories.find(x=>x.id===e.target.dataset.cat), b=c.benefits.find(x=>x.k===e.target.dataset.k); const antes=b.qty; b.qty=Math.max(0,parseInt(e.target.value,10)||0); logA("Categoria editada", c.name+" · "+b.name, antes, b.qty); save(); toast("Padrão da categoria atualizado. Contratos já assinados não mudam."); }
});
/* Mantém o outro portal atualizado quando os dois estão abertos ao mesmo tempo */
window.addEventListener("storage", e=>{
  if(e.key!==STORE_KEY||!e.newValue) return;
  if(document.querySelector(".overlay form")){ syncPendente=true; return; } // espera o formulário aberto terminar
  try{ S=JSON.parse(e.newValue); }catch(err){ return; }
  if(ui.view==="parceiro"&&!S.partners.find(p=>p.id===ui.pid)) ui.view="parceiros";
  const u=me(), el=document.activeElement, digitando=el&&/^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName);
  if(!u||(!u.interno&&!u.termos)||digitando) return;
  render();
});
function restaurar(){ S=seed(); save(); session=null; ui=uiInicial(); ui.msg={k:"info",t:PORTAL==="equipe"?"Dados originais restaurados.":"Dados de exemplo restaurados."}; render(); }
const resetBtn=document.getElementById("resetBtn"); if(resetBtn) resetBtn.addEventListener("click",restaurar);

OP = window.ICOperacao.init({S:()=>S,ui:()=>ui,me,can,esc,fmtD,iso,parse,today,DAY,uid,logA,save,render,toast,pl,brl,modal,addDays,norm,ic,paginas,cortesiasEvento});
render();
})();

</script>
